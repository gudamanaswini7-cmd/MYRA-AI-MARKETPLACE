<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reelsly</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css', v='20261013-cloud-reels') }}">
</head>
<body>
  <div class="phone">
    <header class="top">
      <h1>reelsly</h1>
      <nav>
        <button class="tab active" data-tab="all">For You</button>
        <button class="tab" data-tab="saved">Saved</button>
      </nav>
      <button id="openUpload" class="post-btn" aria-label="Post a reel">＋</button>
    </header>

    <main id="feed" class="feed"></main>
    <button id="scrollNext" class="scroll-btn" type="button" aria-label="Scroll to next reel" title="Scroll to next reel">↓</button>
    <div id="empty" class="empty" hidden></div>
    <div id="toast" class="toast"></div>

    <dialog id="uploadModal">
      <form id="uploadForm">
        <h2>Post a reel</h2>
        <input name="creator" placeholder="Your creator name" maxlength="30" required>
        <textarea name="caption" placeholder="Write a caption… #hashtags" maxlength="200"></textarea>
        <input type="file" name="video" accept="video/mp4,video/webm,video/quicktime" required>
        <div class="row">
          <button type="button" id="cancelUpload" class="ghost">Cancel</button>
          <button type="submit" id="submitUpload">Post</button>
        </div>
      </form>
    </dialog>
  </div>
  <script src="{{ url_for('static', filename='app.js', v='20261013-cloud-reels') }}"></script>
</body>
</html>
